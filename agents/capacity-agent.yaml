name: capacity-agent
description: Zone node pool limits, spot share, arch fit, node pool sizes, quota headroom, idle resources, cost
instructions: prompts/capacity-agent.md
triggers: [schedule-weekly, quota-alert, budget-alert]
model: { effort: high, maxTurns: 80 }
tools:
  - design
  - guardrails_read
  - azure_cli
  - azure_resource_graph
  - log_analytics_query
  - kubectl
  - repo_read: { repositories: [iac, fleet] }
  - repo_write:
      paths:
        iac: ["environments/*/capacity.auto.tfvars"]
  - create_pull_request: { repositories: [iac, fleet] }
  - search_issues: { repositories: [iac, fleet] }
  - create_issue: { repositories: [iac, fleet], labels: [capacity, cost, right-sizing, application-team] }
