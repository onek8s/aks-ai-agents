name: egress-agent
description: Egress through the hub firewall (D61) – learns the applications' denied destinations and proposes their firewall rules
instructions: prompts/egress-agent.md
triggers: [schedule-hourly, firewall-deny-alert]
model: { effort: high, maxTurns: 25 }
tools:
  - design
  - firewall_denied_flows
  - pods_by_ip
  - application_source
  - kubectl
  - repo_read: { repositories: [firewall, fleet, apps] }
  # Only the per-application egress files of the landing zone's firewall policies: one file per application
  # namespace. The zones' allow-lists, the platform's rules and the policies themselves stay with humans.
  - repo_write:
      paths:
        firewall: ["stacks/platform-extensions/firewall-applications/*/*.yaml"]
  # Adds entries to those files; existing entries are never rewritten (create_pull_request refuses that too).
  - firewall_egress_add
  - create_pull_request: { repositories: [firewall] }
  - search_issues: { repositories: [firewall] }
