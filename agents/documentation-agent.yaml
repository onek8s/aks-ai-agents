name: documentation-agent
description: Documents every application's traffic flows (design section 5.3) – who reaches it, what it reaches through the hub firewall and who asked for each rule – as a picture per application and per isolation zone, and the lab's test applications on the design site's lab examples (examples/lab/, aks-agent docs lab)
instructions: prompts/documentation-agent.md
triggers: [merged-firewall-rule, merged-application-change, schedule-weekly]
model: { effort: medium, maxTurns: 15 }
tools:
  - design
  # Generates the pages into the workspace of the documentation repository (platform.yaml documentation.repository,
  # the landing zone by default): deterministic, from Git alone, no cluster and no model.
  - traffic_flow_docs
  - repo_read: { repositories: [firewall, fleet, iac, apps] }
  # Only the generated pages; the rule files, the allow-lists and everything else stay with the egress agent and humans.
  # The lab examples of the design site (examples/lab/ of the design repository), generated by `aks-agent docs lab`:
  # outside the requirements and the design, which stay with humans and their own reviews.
  - repo_write:
      paths:
        firewall: ["docs/traffic-flows/*"]
        design: ["examples/lab/*"]
  - create_pull_request: { repositories: [firewall, design] }
  - search_issues: { repositories: [firewall] }
