# The OneK8s build tenant (the lab): the onek8s organisation's repositories and the dev environment as it runs since
# 2026-10-15 (germanywestcentral, internal exposure, behind labfw in the hub). Used by aks-terraform's agent
# workflows (AKS_AGENT_PLATFORM=config/onek8s-dev.yaml); config/platform.yaml stays the production example.

git:
  platform: github
  defaultBranch: main
  repositories:
    iac: onek8s/aks-terraform
    fleet: onek8s/aks-fluxcd-platform
    apps: onek8s/aks-fluxcd-example
    firewall: onek8s/azure-landing-zone
    design: onek8s/onek8s.github.io
    runbooks: onek8s/aks-terraform
    guardrails: onek8s/aks-ai-agents

model:
  # gpt-4.1-mini on the agents' Foundry resource (aks-terraform shared/ ai_foundry.openai_deployments): the lab's model
  # while sub-aks-dev has no Claude quota (2026-10-15, the user's choice - "good enough for the lab"). With Claude:
  # provider foundry, name claude-sonnet-5-5.
  provider: azure-openai           # anthropic | foundry | azure-openai
  name: gpt-4.1-mini               # the deployment name
  foundryResource: ais-onek8s-dev-agents
  fallbacks: []

audit:
  runsDir: runs
  storageAccount: ""
  container: agent-runs

documentationSites:
  - learn.microsoft.com
  - github.com
  - raw.githubusercontent.com

environments:
  dev:
    subscription: sub-aks-dev
    region: germanywestcentral
    resourceGroup: rg-aks-dev
    clusters: [aks-dev-int-stateless-az3]
    # The hub firewall (design D53, D61): labfw's denied connections in its own workspace log-labfw-germanywestcentral
    # (table LabfwFirewallLog_CL, AZFW columns; azure-landing-zone modules/labfw logs.tf), read with Reader. The
    # workflow passes the workspace ID as AKS_AGENT_FIREWALL_WORKSPACE. An Azure Firewall: no table (AZFW tables).
    firewall:
      log: log_analytics
      table: LabfwFirewallLog_CL
      # Allowed flows too (`aks-agent egress new --include-allowed`): for a firewall that still allows by default, so every
      # application's egress becomes its own rule first. Off here: labfw denies by default and logs denials only.
      includeAllowed: false
      spoke: dev-int                # firewall-applications/<spoke>/ of azure-landing-zone
      sourcePrefixes: [100.64.0.0/10]
      cells:
        aks-dev-int-stateless-az3: [100.64.0.0/16]

# The documentation agent's pages (design section 5.3): docs/traffic-flows/<spoke>/ of the landing zone, next to the
# rule files they document.
documentation:
  repository: firewall
  path: docs/traffic-flows

platformNamespaces: [kube-system, flux-system, gatekeeper-system, external-dns, external-secrets, infra-observability]
