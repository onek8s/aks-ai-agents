apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aks-hello
spec:
  parentRefs:
    - kind: Gateway
      namespace: ${zone}-gateway
      name: ${zone}
  hostnames:
    - hello-${cluster_name}.${zone_domain}
  rules:
    - backendRefs:
        - name: aks-hello
          port: 80
