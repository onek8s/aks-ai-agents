# Risk tier rules of the merge gate (design section 6.1). The tier of a pull request is the strictest tier of any
# rule that matches what its plan does. Semantic rules (versions, policy effects, image promotion, limits,
# VerticalPodAutoscaler bounds and resource-only workload changes) are implemented in aks_gate.rules and documented
# there.

defaults:
  resource: medium               # an IaC change no rule below knows
  manifest: medium               # a rendered manifest change no rule below knows
  file: medium                   # a changed file without a plan or manifest effect

resources:
  - id: identity
    tier: high
    types:
      - Microsoft.Authorization/roleAssignments
      - Microsoft.Authorization/roleDefinitions
      - Microsoft.ManagedIdentity/userAssignedIdentities
      - Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials
  - id: network
    tier: high
    types:
      - Microsoft.Network/virtualNetworks
      - Microsoft.Network/virtualNetworks/subnets
      - Microsoft.Network/virtualNetworks/virtualNetworkPeerings
      - Microsoft.Network/networkSecurityGroups
      - Microsoft.Network/networkSecurityGroups/securityRules
      - Microsoft.Network/routeTables
      - Microsoft.Network/routeTables/routes
      - Microsoft.Network/azureFirewalls
      - Microsoft.Network/firewallPolicies
      - Microsoft.Network/firewallPolicies/ruleCollectionGroups
      - Microsoft.Network/publicIPAddresses
      - Microsoft.Network/privateEndpoints
  - id: key-vault-access
    tier: high
    types: [Microsoft.KeyVault/vaults/accessPolicies]
  - id: policy-exemption
    tier: high
    types: [Microsoft.Authorization/policyExemptions]
  - id: locks
    tier: high
    types: [Microsoft.Authorization/locks]
  - id: data-deletion
    tier: high
    actions: [delete, replace]
    types:
      - Microsoft.KeyVault/vaults
      - Microsoft.KeyVault/vaults/keys
      - Microsoft.KeyVault/vaults/secrets
      - Microsoft.ContainerRegistry/registries
      - Microsoft.Storage/storageAccounts
      - Microsoft.Sql/servers
      - Microsoft.Sql/servers/databases
      - Microsoft.DBforPostgreSQL/flexibleServers
      - Microsoft.DocumentDB/databaseAccounts
      - Microsoft.Cache/redis
      - Microsoft.ServiceBus/namespaces
      - Microsoft.EventHub/namespaces
      - Microsoft.Compute/diskEncryptionSets
  - id: policy-definition
    tier: medium
    types: [Microsoft.Authorization/policyDefinitions, Microsoft.Authorization/policySetDefinitions]
  - id: monitoring
    tier: low
    actions: [create, update]
    types:
      - Microsoft.Insights/metricAlerts
      - Microsoft.Insights/scheduledQueryRules
      - Microsoft.Insights/actionGroups
      - Microsoft.Portal/dashboards
      - Microsoft.Dashboard/grafana

manifests:
  - id: kubernetes-rbac
    tier: high
    kinds: [ClusterRole, ClusterRoleBinding, Role, RoleBinding]
  - id: cluster-network-policy
    tier: high
    kinds: [CiliumClusterwideNetworkPolicy, CiliumEgressGatewayPolicy, CiliumCIDRGroup]
  - id: node-class
    tier: medium
    kinds: [AKSNodeClass]
  - id: new-namespace          # applications are onboarded by the onboarding agent
    tier: low
    kinds: [Namespace]
    actions: [create]
  - id: namespace-deletion
    tier: high
    kinds: [Namespace, PersistentVolumeClaim, StatefulSet]
    actions: [delete]
  - id: autoscaling
    tier: low
    kinds: [HorizontalPodAutoscaler, ScaledObject, NodePool, PodDisruptionBudget]
    actions: [create, update]
  - id: monitoring
    tier: low
    kinds: [PrometheusRule, ServiceMonitor, PodMonitor, ConfigMap]
    namespaces: [monitoring, kube-system]
  - id: monitoring-rules
    tier: low
    kinds: [PrometheusRule, ServiceMonitor, PodMonitor]

files:
  - id: pipelines
    tier: high
    paths: [".github/workflows/**", ".github/actions/**", "pipelines/**", ".azure-pipelines/**", "azure-pipelines*.yml"]
  - id: codeowners
    tier: high
    paths: [".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"]
  - id: documentation
    tier: low
    paths: ["**/*.md", "docs/**"]

repositories:
  # Changes in these repositories are humans only.
  notAllowedForAgents: [guardrails, runbooks]

# What each tier needs before the gate passes. Human approvals count only from members of the named teams, on the
# head commit, from someone other than the author; agents' GitHub Apps are never team members.
approvals:
  low: { reviewerAgent: true, teams: [] }
  medium: { reviewerAgent: true, teams: [platform] }
  high: { reviewerAgent: true, teams: [platform, security] }

teams:
  platform: platform-engineers
  security: security-engineers

reviewerAgent:
  check: reviewer-agent          # check run the reviewer agent publishes on the head commit

# GitHub App bot login of each agent; agent pull requests come from agent/<name>/* branches.
agents:
  operations-agent: aks-operations-agent[bot]
  platform-agent: aks-platform-agent[bot]
  upgrade-agent: aks-upgrade-agent[bot]
  release-agent: aks-release-agent[bot]
  capacity-agent: aks-capacity-agent[bot]
  security-agent: aks-security-agent[bot]
  onboarding-agent: aks-onboarding-agent[bot]
  rightsizing-agent: aks-rightsizing-agent[bot]
  reviewer-agent: aks-reviewer-agent[bot]

# Azure DevOps: each agent's managed identities (one per environment) are Azure DevOps users; their names, as
# glob patterns (a "*" is required to use a pattern).
agentsAzureDevOps:
  operations-agent: id-agent-operations-agent-*
  platform-agent: id-agent-platform-agent-*
  upgrade-agent: id-agent-upgrade-agent-*
  release-agent: id-agent-release-agent-*
  capacity-agent: id-agent-capacity-agent-*
  security-agent: id-agent-security-agent-*
  onboarding-agent: id-agent-onboarding-agent-*
  rightsizing-agent: id-agent-rightsizing-agent-*
  reviewer-agent: id-agent-reviewer-agent-*

pullRequest:
  # Sections every agent pull request body must have (design section 6.1).
  requiredSections: [Intent, Evidence, Design section, Rollback]
  requiredTrailers: [Agent, Agent-Run]
  incidentFixLabel: incident-fix  # counts only when a human added it
