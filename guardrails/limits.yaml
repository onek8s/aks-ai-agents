# Numbers the merge gate checks (design section 6.1, "Risk tiers"). Owned by humans: every change to this file
# needs two approvals (platform + security). Agents can read it but never change it.

agents:
  enabled: true                  # kill switch: false makes the gate reject every agent pull request
  # "Start small": a minimum tier per agent and environment, relaxed as the measured outcome allows.
  minimumTier:
    "*": { dev: low, acc: medium, prd: medium }
  openPullRequests: { "*": 5 }

environments:
  dev:
    changeWindows: []            # empty = always open
    freezes: []
    maxMergesPerDay: { "*": 20 }
  acc:
    changeWindows: ["Mon-Fri 07:00-17:00 Europe/Helsinki"]
    freezes: []
    maxMergesPerDay: { "*": 10 }
  prd:
    changeWindows: ["Mon-Thu 08:00-15:00 Europe/Helsinki"]
    freezes: ["2026-12-18/2027-01-06"]
    maxMergesPerDay: { upgrade-agent: 2, capacity-agent: 3, platform-agent: 5, "*": 2 }
    maxCellsPerPullRequest: 1

nodePools:                       # per environment overrides under environments.<env>.nodePools
  maxNodesPerPool: { soft: 30, hard: 60 }        # classic node pools (system pool, stateful zone pools)
  maxCpuPerZone: { soft: 960, hard: 1920 }       # NAP NodePool spec.limits.cpu, on-demand + spot of one zone
  maxSpotShare: 0.5                              # spot NodePool cpu limit / zone total
  allowedVmSizes:
    - Standard_D4ads_v6
    - Standard_D8ads_v6
    - Standard_D16ads_v6
    - Standard_D4pds_v6
    - Standard_D8pds_v6
    - Standard_D16pds_v6

rightSizing:                     # per environment overrides under environments.<env>.rightSizing
  # VerticalPodAutoscaler objects of applications. The VPA updater resizes pods in place, online, within these
  # bounds; agents tune the bounds and modes by pull request.
  updateModes: ["Off", Initial, InPlaceOrRecreate]  # other modes (Recreate, Auto) = medium
  statefulUpdateModes: ["Off"]                     # stateful cluster: recommendations only
  controlledValues: [RequestsOnly]                 # RequestsAndLimits = medium
  maxAllowed:                                      # per container (VPA maxAllowed, resources in Git)
    cpu: { soft: 4, hard: 16 }
    memory: { soft: 16Gi, hard: 64Gi }
  # A change of nothing but requests / limits in a workload (container or pod-level resources): each value may move
  # at most this factor up or down; more = medium.
  maxStepFactor: 2

kubernetes:
  # 1.36 is the platform floor (every cluster starts on it); newer minors are added by the upgrade agent's pull
  # request, approved per tier.
  allowedMinors: { stateless: ["1.36"], stateful: ["1.36"] }
  statefulClusterPattern: "^aks-[a-z]+-sf$"
  cellPattern: "(sl-az[0-9]+|sf)"

network:
  # Address spaces reserved for the platform in the corporate IPAM; anything outside is rejected.
  allowedAddressSpaces: ["10.64.0.0/12", "10.80.0.0/12", "10.96.0.0/12"]

roleAssignments:
  maxScope: resourceGroup        # wider (subscription, management group) is rejected
  # Whitelist: role assignments of any other role are rejected for agents and tier high for humans. List built-in
  # roles by name; custom roles by role definition GUID.
  allowedRoles:
    # application identities on their own resources (onboarding pattern)
    - Key Vault Secrets User                     # only with an approved secret exception
    - Key Vault Certificate User
    - Storage Blob Data Reader
    - Storage Blob Data Contributor
    - Storage Queue Data Reader
    - Storage Queue Data Contributor
    - Azure Service Bus Data Sender
    - Azure Service Bus Data Receiver
    - Azure Event Hubs Data Sender
    - Azure Event Hubs Data Receiver
    - Monitoring Metrics Publisher
    # platform identities (cluster modules)
    - AcrPull
    - Key Vault Crypto Service Encryption User   # disk encryption sets, KMS (section 4.2)
    - Network Contributor                        # cluster identity on its own subnets
    - Managed Identity Operator
    # read-only
    - Reader
    - Monitoring Reader
    - Key Vault Reader

forbidden:                       # rejected for agents; tier high for humans
  - action: delete
    types:
      - Microsoft.KeyVault/vaults
      - Microsoft.ContainerRegistry/registries
      - Microsoft.Storage/storageAccounts
      - Microsoft.Sql/servers
      - Microsoft.DBforPostgreSQL/flexibleServers
      - Microsoft.DocumentDB/databaseAccounts

blastRadius:
  maxResources: { soft: 25, hard: 200 }          # changed resources per pull request

# Agent identities are managed only from the guardrails repository.
agentIdentityPattern: "^(id|app)-agent-"
